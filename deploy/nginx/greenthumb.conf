# GreenThumb site for the new VPS. Install as /etc/nginx/sites-available/greenthumb
# and symlink it from sites-enabled. Express listens on 127.0.0.1:5000 only.

proxy_cache_path /var/cache/nginx/gt_photos levels=1:2 keys_zone=gt_photos:10m max_size=1g inactive=1d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name greenthumb.xmpp.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name greenthumb.xmpp.site;

    # Issued on this server by certbot (webroot /var/www/certbot); renewed by certbot.timer.
    ssl_certificate /etc/letsencrypt/live/greenthumb.xmpp.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greenthumb.xmpp.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:gt_ssl:10m;
    ssl_session_timeout 1d;

    # Express (12 MB JSON limit) must be the one to reject large bodies, with a JSON 413.
    client_max_body_size 13m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    location = /photos {
        return 404;
    }

    location /photos/ {
        proxy_pass http://127.0.0.1:5000;
        # Photos are public by unguessable URL; the cache must never carry a session.
        proxy_set_header Cookie "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_cache gt_photos;
        # Express sends a 1-year immutable Cache-Control for clients; without ignoring it here,
        # nginx would keep a deleted photo for a year instead of at most 1 day.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
    }
}
